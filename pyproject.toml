[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-telegram-ads"
version = "0.2.0"
description = "ads.telegram.org adapter + typed agent tools + read-only watcher + local stdio MCP"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "playwright>=1.49",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
telegram-ads-mcp = "hermes_telegram_ads.mcp:main"

[tool.setuptools.packages.find]
include = ["hermes_telegram_ads*"]

[tool.setuptools.package-data]
hermes_telegram_ads = ["selectors.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
